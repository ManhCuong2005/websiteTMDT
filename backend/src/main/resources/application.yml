spring:
  application:
    name: banhang-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banhang_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:banhang-local-secret-change-this-key-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@banhang.vn}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  face:
    service-url: ${FACE_SERVICE_URL:http://127.0.0.1:8001}
    encryption-secret: ${FACE_DATA_SECRET:${app.jwt.secret}}
    match-threshold: ${FACE_MATCH_THRESHOLD:0.45}
  blockchain:
    rpc-url: ${GANACHE_RPC_URL:http://127.0.0.1:7545}
    chain-id: ${GANACHE_CHAIN_ID:1337}
    merchant-address: ${MERCHANT_WALLET_ADDRESS:0x64def5FBD89a8f59eBE6917Bf9460e85c258c725}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x4Ea52fE2a889f391eC5Fc433a7bD4f8ad3A675ba}
    payment-selector: ${BLOCKCHAIN_PAYMENT_SELECTOR:0x58504a36}
    vnd-per-eth: ${VND_PER_ETH:50000000}

logging:
  level:
    org.hibernate.SQL: warn
